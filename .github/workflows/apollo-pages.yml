name: Deploy Apollo to GitHub Pages
on:
  push:
    branches: [apollo-body-tracking]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: apollo-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package static game and pose runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/{build,assets,apollo/tracker/assets/wasm}
          cp LICENSE index.html site/
          cp -R assets/{fonts,img,models,sounds} site/assets/
          rm -f site/assets/img/envmap.psd
          cp apollo/plugin.js site/apollo/
          cp apollo/tracker/{index.html,tracker.mjs} site/apollo/tracker/
          release=https://raw.githubusercontent.com/supermedium/moonrider/725c9e5dcc77a2eea3de7a819dfca7f15f7ce83e/build
          for f in build.js zip.js; do curl -fsSL --retry 3 "$release/$f" -o "site/build/$f"; done
          aframe=https://cdn.jsdelivr.net/gh/aframevr/aframe@2c4509aa1a9a3c447c08be9facfea0c7d6a9e156/dist/aframe-master.min.js
          curl -fsSL --retry 3 "$aframe" -o site/build/aframe.min.js
          sed -i "s|$aframe|build/aframe.min.js|" site/index.html
          vision=https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304
          for f in vision_bundle.mjs wasm/vision_wasm{,_nosimd}_internal.{js,wasm}; do
            curl -fsSL --retry 3 "$vision/$f" -o "site/apollo/tracker/assets/$f"
          done
          curl -fsSL --retry 3 https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task -o site/apollo/tracker/assets/pose.task
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
